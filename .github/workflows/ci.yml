name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main


jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build Docker image
        run: docker build --tag booking-system:ci .

  publish-image:
    name: Publish Docker image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/schloenkin/booking-system-v3
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image for publishing
        run: docker build --tag "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"